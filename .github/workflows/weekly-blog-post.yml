name: Weekly blog post

on:
  schedule:
    # Twice a week — Sunday and Wednesday, both off the top of the hour to
    # avoid GitHub's scheduled-workflow congestion around :00.
    - cron: "17 8 * * 0"
    - cron: "42 8 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Anthropic SDK
        run: npm install --no-save @anthropic-ai/sdk

      - name: Generate blog post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "blog: add weekly post — ${{ steps.generate.outputs.title }}"
          branch: blog/weekly-${{ github.run_number }}
          title: "New blog post: ${{ steps.generate.outputs.title }}"
          body: |
            Auto-generated by the weekly blog post workflow.

            Slug: `${{ steps.generate.outputs.slug }}`

            Please review the draft (facts and tone) before merging — nothing here publishes until this PR is merged.
